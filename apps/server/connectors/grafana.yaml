# Built-in connector definition (docs/ARCHITECTURE.md, "Connectors").
identifier: grafana
title: Grafana
description: Dashboards, folders, data sources and alert rules; create folders and annotations.
icon: chart-line
category: observability
fields:
  properties:
    baseUrl: { type: string, title: Grafana URL, format: url }
    publicUrl:
      type: string
      title: Public URL
      format: url
      description: 'Base of the links in operation outputs when the API URL is internal (e.g. a cluster service). Empty: the Grafana URL'
  required: [baseUrl]
  order: [baseUrl, publicUrl]
auth:
  - type: bearer
    title: Service account token
    description: 'Viewer is enough for ingestion; the operations need Editor (folders:create, annotations:create).'
test:
  path: /api/search
  query: { limit: '1' }
kinds:
  dashboard: { title: Dashboards, path: /api/search, query: { type: dash-db, limit: '5000' } }
  folder: { title: Folders, path: /api/folders, query: { limit: '1000' } }
  datasource: { title: Data sources, path: /api/datasources }
  alert-rule: { title: Alert rules, path: /api/v1/provisioning/alert-rules }
operations:
  create-folder:
    title: Create a folder
    description: Creates a folder (nested under `parentUid` when given; Grafana 11+). The uid is generated when empty.
    kind: folder
    inputs:
      properties:
        title: { type: string, title: Title }
        uid: { type: string, title: UID, pattern: '^[A-Za-z0-9_-]{1,40}$', description: 'Empty: generated by Grafana' }
        parentUid: { type: string, title: Parent folder UID }
      required: [title]
    method: POST
    path: /api/folders
    body: { title: '{{ inputs.title }}', uid: '{{ inputs.uid }}', parentUid: '{{ inputs.parentUid }}' }
    output:
      uid: body.uid
      title: body.title
      url: '(connection.publicUrl ? connection.publicUrl : connection.baseUrl) & body.url'
  create-annotation:
    title: Add an annotation
    description: An annotation on a dashboard (or an organization-wide one without dashboard), at the current time unless `time` is given.
    kind: dashboard
    inputs:
      properties:
        text: { type: string, title: Text }
        dashboardUid: { type: string, title: Dashboard UID, description: 'Empty: an organization annotation' }
        tags: { type: array, title: Tags, items: { type: string } }
        time: { type: integer, title: Time (epoch ms), description: 'Empty: now' }
        timeEnd: { type: integer, title: End time (epoch ms), description: 'A region annotation when given' }
      required: [text]
    method: POST
    path: /api/annotations
    body:
      text: '{{ inputs.text }}'
      dashboardUID: '{{ inputs.dashboardUid }}'
      tags: '{{ inputs.tags }}'
      time: '{{ inputs.time }}'
      timeEnd: '{{ inputs.timeEnd }}'
    output: { id: body.id }
example:
  fields: { baseUrl: https://grafana.example.com }
  auth: { type: bearer, token: '${secret:GRAFANA_TOKEN}' }
  mappings:
    - kind: dashboard
      entity: { blueprint: dashboard, identifier: uid, title: title, properties: { url: url } }
