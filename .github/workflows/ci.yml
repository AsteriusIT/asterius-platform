name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: ast, POSTGRES_PASSWORD: ast, POSTGRES_DB: ast }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Server tests on Postgres
        run: npm test -w apps/server
        env: { TEST_DATABASE_URL: 'postgres://ast:ast@localhost:5432/ast' }
      - run: npm run build
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: |
          helm lint deploy/helm/asterius-platform --set database.url=postgres://ci --set auth.providers=local
          helm lint deploy/helm/asterius-platform --set database.cnpg.enabled=true --set auth.providers=local \
            --set rbac.clusterRead.enabled=true --set 'rbac.jobNamespaces={jobs}' --set metrics.serviceMonitor.enabled=true

  # Vulnerabilities in the lockfile (all workspaces): fails on fixable HIGH/CRITICAL findings.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: package-lock.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  image:
    needs: [check, dependencies]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV" # registry names must be lowercase
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build once locally, scan it, then publish the same layers (build cache) on pushes to main.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:scan
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
      - name: Publish image
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push'
      - name: Sign image and attach the SBOM attestation (keyless)
        if: github.event_name == 'push'
        run: |
          cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${{ steps.push.outputs.digest }}"
