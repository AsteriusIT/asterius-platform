name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: ast, POSTGRES_PASSWORD: ast, POSTGRES_DB: ast }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Server tests on Postgres
        run: npm test -w apps/server
        env: { TEST_DATABASE_URL: 'postgres://ast:ast@localhost:5432/ast' }
      - run: npm run build
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: |
          helm lint deploy/helm/asterius-platform --set database.url=postgres://ci --set auth.providers=local
          helm lint deploy/helm/asterius-platform --set database.cnpg.enabled=true --set auth.providers=local \
            --set rbac.clusterRead.enabled=true --set 'rbac.jobNamespaces={jobs}' --set metrics.serviceMonitor.enabled=true

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV" # registry names must be lowercase
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
