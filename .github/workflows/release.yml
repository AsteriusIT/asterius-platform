name: Release

# Tag vX.Y.Z: publishes the image (semver tags, signed, SBOM attested) and the Helm chart as an OCI artifact.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV" # registry names must be lowercase
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: APP_VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:scan
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
      - name: Publish image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
      - uses: sigstore/cosign-installer@v3
      - name: Sign image and attach the SBOM attestation (keyless)
        run: |
          cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${{ steps.push.outputs.digest }}"
      - uses: azure/setup-helm@v4
      - name: Package and push the Helm chart (OCI)
        run: |
          helm lint deploy/helm/asterius-platform --set database.url=postgres://ci --set auth.providers=local
          helm package deploy/helm/asterius-platform --version "$VERSION" --app-version "$VERSION" --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/asterius-platform-${VERSION}.tgz" "oci://${IMAGE%/*}/charts" 2>&1 | tee push.log
          DIGEST="$(grep -o 'sha256:[0-9a-f]*' push.log | tail -1)"
          cosign sign --yes "${IMAGE%/*}/charts/asterius-platform@${DIGEST}"
