# Alias Services: the in-cluster URLs of docs/V2-KIND.md resolve whatever the charts name their Services.
# Already named by their charts (fullnameOverride / release name): loki.observability:3100,
# tempo.observability:3200/4317, otel-collector.otel:4317/4318, argocd-server.argocd:80, openbao.openbao:8200.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: kps-prometheus
  ports:
    - { name: http, port: 9090, targetPort: 9090, protocol: TCP }
