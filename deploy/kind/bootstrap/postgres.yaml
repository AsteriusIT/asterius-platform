# Portal database: one plain PostgreSQL 17 pod (no operator). Credentials from OpenBao secret/asterius-platform/postgres
# (ExternalSecret portal-postgres in secrets.yaml); DATABASE_URL is in asterius-platform-secrets.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: asterius-platform
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432, protocol: TCP }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: asterius-platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      securityContext: { fsGroup: 70 }
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: asterius }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: portal-postgres, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: portal-postgres, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d asterius'] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
