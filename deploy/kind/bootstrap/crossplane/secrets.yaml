# Crossplane profile: the catalog watcher's HMAC secret (docs/V2-CROSSPLANE.md "Catalog watcher → portal").
#
#   platform/watcher  secret   asterius-platform/portal-v2 (CROSSPLANE_WATCHER_SECRET), portal-agent/watcher (secret),
#                              and CROSSPLANE_WATCHER_SECRET in asterius-platform/asterius-platform-secrets
#
# Applied after bootstrap/secrets.yaml: the asterius-platform-secrets below replaces the lean one (same keys plus
# CROSSPLANE_WATCHER_SECRET). Re-running the lean profile applies the lean one again and drops the key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-v2
  namespace: asterius-platform
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: portal-v2, creationPolicy: Owner }
  data:
    - secretKey: CROSSPLANE_WATCHER_SECRET
      remoteRef: { key: platform/watcher, property: secret }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: watcher
  namespace: portal-agent
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: watcher, creationPolicy: Owner }
  data:
    - secretKey: secret
      remoteRef: { key: platform/watcher, property: secret }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asterius-platform-secrets
  namespace: asterius-platform
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: asterius-platform-secrets, creationPolicy: Owner }
  dataFrom:
    - extract: { key: asterius-platform/env }
  data:
    - secretKey: ADO_PAT
      remoteRef: { key: platform/ado, property: pat }
    - secretKey: ARGOCD_TOKEN
      remoteRef: { key: platform/argocd, property: token }
    - secretKey: CROSSPLANE_WATCHER_SECRET
      remoteRef: { key: platform/watcher, property: secret }
