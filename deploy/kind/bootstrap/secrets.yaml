# OpenBao → External Secrets → Kubernetes Secrets, lean profile (docs/V2-KIND.md).
#
#   OpenBao (KV v2 mount secret/)      Kubernetes Secret
#   platform/ado         pat, org_url  asterius-platform/portal-ado (ADO_PAT), argocd/repo-portal-resources
#   platform/argocd      token         (ARGOCD_TOKEN of the portal)
#   asterius-platform/env              asterius-platform/asterius-platform-secrets (+ ADO_PAT, ARGOCD_TOKEN as env vars)
#   asterius-platform/postgres         asterius-platform/portal-postgres
#   observability/grafana              observability/grafana-admin
#
# The crossplane profile adds bootstrap/crossplane/secrets.yaml (watcher secret; it replaces asterius-platform-secrets
# with a version that also carries CROSSPLANE_WATCHER_SECRET).
# ClusterSecretStore `openbao`: Kubernetes auth role `eso` (ServiceAccount external-secrets/openbao-reader).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-reader
  namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef: { name: openbao-reader, namespace: external-secrets }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-ado
  namespace: asterius-platform
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: portal-ado, creationPolicy: Owner }
  data:
    - secretKey: ADO_PAT
      remoteRef: { key: platform/ado, property: pat }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-postgres
  namespace: asterius-platform
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: portal-postgres, creationPolicy: Owner }
  dataFrom:
    - extract: { key: asterius-platform/postgres }
---
# The chart's Secret (secrets.existingSecret, loaded with envFrom): every key of asterius-platform/env plus the V2
# credentials as environment variables.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asterius-platform-secrets
  namespace: asterius-platform
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: asterius-platform-secrets, creationPolicy: Owner }
  dataFrom:
    - extract: { key: asterius-platform/env }
  data:
    - secretKey: ADO_PAT
      remoteRef: { key: platform/ado, property: pat }
    - secretKey: ARGOCD_TOKEN
      remoteRef: { key: platform/argocd, property: token }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: grafana-admin, creationPolicy: Owner }
  dataFrom:
    - extract: { key: observability/grafana }
---
# Argo CD repository credential for the Portal repo (any username, the PAT as password).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-portal-resources
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: repo-portal-resources
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        name: portal-resources
        url: https://dev.azure.com/AsteriusIT/Platform/_git/portal-resources
        username: asterius-v2-kind
        password: "{{ .pat }}"
  data:
    - secretKey: pat
      remoteRef: { key: platform/ado, property: pat }
