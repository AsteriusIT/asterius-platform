# App of apps: every Application / AppProject in portal-resources/argocd/*.yaml (not recursive).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: asterius-root
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://dev.azure.com/AsteriusIT/Platform/_git/portal-resources
    targetRevision: main
    path: argocd
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
