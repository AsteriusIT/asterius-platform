# OTel Collector agent (namespace otel): DaemonSet reading container logs and forwarding them to the gateway
# (otel-collector.otel.svc:4317), which adds the Loki labels and exports.
#   lean        asterius-jobs pods (Kubernetes Job invoker: one-shot operations) → source=action-runner,
#               run_id from the pod label asterius.io/run-id (set by the invoker) or portal.asterius.io/run-id
#   crossplane  + crossplane-system (Crossplane, providers, functions) → source=provider, provider=<package name>
#               (values/otel-agent-crossplane.yaml replaces the include list)
fullnameOverride: otel # chart suffix -agent: DaemonSet otel-agent
mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib
resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { memory: 256Mi }
# Reads /var/log/pods (root-owned on kind nodes).
securityContext:
  runAsUser: 0
  runAsGroup: 0
service:
  enabled: false

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: [pods, namespaces, nodes]
      verbs: [get, list, watch]
    - apiGroups: [apps]
      resources: [replicasets]
      verbs: [get, list, watch]

extraEnvs:
  - name: K8S_NODE_NAME
    valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
extraVolumes:
  - name: varlogpods
    hostPath: { path: /var/log/pods }
extraVolumeMounts:
  - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }

ports:
  otlp: { enabled: false }
  otlp-http: { enabled: false }
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }

alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    file_log:
      include:
        - /var/log/pods/asterius-jobs_*/*/*.log
      start_at: end
      include_file_path: true
      operators:
        # CRI-O / containerd line format; sets k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.container.name.
        - type: container
          id: container-parser
        # JSON bodies (providers and most steps log JSON): parsed into attributes, body kept.
        - type: json_parser
          if: 'body matches "^\\s*\\{"'
          parse_to: attributes["log"]
          on_error: send_quiet
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    k8s_attributes:
      auth_type: serviceAccount
      passthrough: false
      filter:
        node_from_env_var: K8S_NODE_NAME
      extract:
        metadata: [k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.deployment.name, k8s.node.name]
        labels:
          - { tag_name: provider, key: pkg.crossplane.io/provider, from: pod }
          - { tag_name: function, key: pkg.crossplane.io/function, from: pod }
          - { tag_name: job_run_id, key: asterius.io/run-id, from: pod }
          - { tag_name: run_id, key: portal.asterius.io/run-id, from: pod }
          - { tag_name: service, key: portal.asterius.io/service, from: pod }
          - { tag_name: step, key: portal.asterius.io/step, from: pod }
          - { tag_name: job, key: batch.kubernetes.io/job-name, from: pod }
      pod_association:
        - sources: [{ from: resource_attribute, name: k8s.pod.uid }]
    transform:
      error_mode: ignore
      log_statements:
        - context: resource
          statements:
            # Job pods (asterius-jobs): run_id from the invoker's label, step = the Job name.
            - set(resource.attributes["run_id"], resource.attributes["job_run_id"]) where resource.attributes["run_id"] == nil and resource.attributes["job_run_id"] != nil
            - delete_key(resource.attributes, "job_run_id")
            - set(resource.attributes["source"], "action-runner") where resource.attributes["k8s.namespace.name"] == "asterius-jobs"
            - set(resource.attributes["step"], resource.attributes["job"]) where resource.attributes["step"] == nil and resource.attributes["job"] != nil
            - set(resource.attributes["step"], resource.attributes["k8s.pod.name"]) where resource.attributes["step"] == nil and resource.attributes["k8s.namespace.name"] == "asterius-jobs"
            # Crossplane profile (crossplane-system pods).
            - set(resource.attributes["source"], "provider") where resource.attributes["k8s.namespace.name"] == "crossplane-system"
            - set(resource.attributes["provider"], resource.attributes["function"]) where resource.attributes["provider"] == nil and resource.attributes["function"] != nil
            - set(resource.attributes["provider"], "crossplane") where resource.attributes["provider"] == nil and resource.attributes["k8s.namespace.name"] == "crossplane-system"
            - set(resource.attributes["namespace"], resource.attributes["k8s.namespace.name"])
            - set(resource.attributes["service.name"], resource.attributes["provider"]) where resource.attributes["provider"] != nil
            - set(resource.attributes["service.name"], "action-runner") where resource.attributes["source"] == "action-runner"
        # Provider log lines name the managed resource and, in Crossplane v2, its namespace (team-<team>).
        - context: log
          statements:
            - set(log.attributes["level"], log.attributes["log"]["level"]) where log.attributes["log"]["level"] != nil
            - set(log.attributes["level"], log.attributes["log"]["severity"]) where log.attributes["log"]["severity"] != nil
            - set(log.attributes["resource"], log.attributes["log"]["request"]) where log.attributes["log"]["request"] != nil
            - set(log.attributes["resource"], log.attributes["log"]["name"]) where log.attributes["log"]["name"] != nil and log.attributes["resource"] == nil
            - set(log.attributes["run_id"], log.attributes["log"]["run_id"]) where log.attributes["log"]["run_id"] != nil
            - delete_key(log.attributes, "log")
    batch:
      send_batch_size: 512
      timeout: 2s
  exporters:
    otlp_grpc:
      endpoint: otel-collector.otel.svc:4317
      tls: { insecure: true }
  service:
    extensions: [health_check]
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus: { host: "${env:MY_POD_IP}", port: 8888 }
    pipelines:
      logs:
        receivers: [file_log]
        processors: [memory_limiter, k8s_attributes, transform, batch]
        exporters: [otlp_grpc]
