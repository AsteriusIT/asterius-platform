# Crossplane v2 core (namespace crossplane-system). Providers, Functions, ProviderConfigs and
# DeploymentRuntimeConfigs are not installed here: Argo CD syncs them from portal-resources (platform/packages/).
resourcesCrossplane:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: "1", memory: 1Gi }
resourcesRBACManager:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { cpu: 500m, memory: 512Mi }
metrics:
  enabled: true
