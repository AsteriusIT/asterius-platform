# Loki, single binary on the filesystem (namespace observability). Service `loki` on :3100.
# OTLP ingestion at /otlp/v1/logs. The resource attributes run_id, service, source, namespace, step, provider become
# index labels (the run page queries {run_id="<id>"}); the OTel Collector moves them from log records to the resource
# (groupbyattrs processor) because Loki promotes only resource attributes to labels.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  pattern_ingester:
    enabled: false
  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    query_timeout: 300s
    volume_enabled: true
    allow_structured_metadata: true
    retention_period: 168h
    max_label_names_per_series: 30
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label
            attributes: [run_id, service, source, namespace, step, provider]
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  ui:
    enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }

gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
