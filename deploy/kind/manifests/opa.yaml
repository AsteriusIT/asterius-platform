# OPA for the portal pre-check (docs/V2-KIND.md "OPA contract"): POST /v1/data/platform/portal/result.
# Loads ConfigMap portal-rego (the files of policies/rego/, generated by the Portal repo kustomization deploy/portal/,
# synced by Argo CD in both profiles). The same Rego runs in the apply pipeline (conftest on the spec and the plan JSON).
# --watch reloads the policies when kubelet swaps the ConfigMap files; --ignore=.* skips the ..data links of the mount.
# Same OPA version as CI (conftest) and Gatekeeper should evaluate: pinned.
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: asterius-platform
  labels: { app.kubernetes.io/name: opa, app.kubernetes.io/part-of: asterius-platform }
spec:
  selector: { app.kubernetes.io/name: opa }
  ports:
    - { name: http, port: 8181, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: asterius-platform
  labels: { app.kubernetes.io/name: opa, app.kubernetes.io/part-of: asterius-platform }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: opa }
  template:
    metadata:
      labels: { app.kubernetes.io/name: opa, app.kubernetes.io/part-of: asterius-platform }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: opa
          image: openpolicyagent/opa:1.22.2-static
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=:8181
            - --diagnostic-addr=:8282
            - --watch
            - --ignore=.*
            - --log-level=info
            - --log-format=json
            - /policies
          ports:
            - { name: http, containerPort: 8181 }
            - { name: diagnostic, containerPort: 8282 }
          readinessProbe:
            httpGet: { path: /health, port: diagnostic }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: diagnostic }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: policies, mountPath: /policies, readOnly: true }
      volumes:
        # optional: OPA starts (with no policies: the portal treats an undefined result as "unavailable" and fails
        # closed) before Argo CD has synced the ConfigMap.
        - name: policies
          configMap: { name: portal-rego, optional: true }
