# Crossplane profile only: replaces the lean plan service Deployment of manifests/render.yaml (applied after it, same
# names) with the Crossplane render (RENDER_MODE=crossplane). Same contract: POST /render {service} → {resources, raw}.
# Render service (V2 preview, docs/V2-CROSSPLANE.md "Render service"): POST /render runs the real `crossplane render`
# (CLI v2, image asterius-render:dev built from apps/render-service) against ConfigMap portal-compositions
# (XRD, Compositions, Functions; generated by the Portal repo kustomization deploy/portal/, synced by Argo CD).
# The composition functions run as sidecars in Development mode: insecure gRPC on localhost, one port each.
# FUNCTION_TARGETS maps a Function (by name or package name) to its sidecar; keep it in line with the sidecars.
apiVersion: v1
kind: Service
metadata:
  name: render
  namespace: asterius-platform
  labels: { app.kubernetes.io/name: render, app.kubernetes.io/part-of: asterius-platform }
spec:
  selector: { app.kubernetes.io/name: render }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: render
  namespace: asterius-platform
  labels: { app.kubernetes.io/name: render, app.kubernetes.io/part-of: asterius-platform }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: render }
  template:
    metadata:
      labels: { app.kubernetes.io/name: render, app.kubernetes.io/part-of: asterius-platform }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: render
          image: asterius-render:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: RENDER_MODE, value: crossplane }
            - { name: COMPOSITIONS_DIR, value: /compositions }
            - { name: HOME, value: /tmp }
            - { name: RENDER_TIMEOUT, value: 60s }
            - name: FUNCTION_TARGETS
              value: function-auto-ready=localhost:9443,function-go-templating=localhost:9444,function-patch-and-transform=localhost:9445
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: compositions, mountPath: /compositions, readOnly: true }
            - { name: tmp, mountPath: /tmp }
        - name: function-auto-ready
          image: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.7.3
          imagePullPolicy: IfNotPresent
          args: [--insecure, --address=:9443]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
        - name: function-go-templating
          image: xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.13.2
          imagePullPolicy: IfNotPresent
          args: [--insecure, --address=:9444]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
        - name: function-patch-and-transform
          image: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.11.2
          imagePullPolicy: IfNotPresent
          args: [--insecure, --address=:9445]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      volumes:
        # optional: the pod starts before Argo CD has synced the ConfigMap (renders answer 503 until then);
        # kubelet refreshes the mounted files when it changes, and every render re-reads them.
        - name: compositions
          configMap: { name: portal-compositions, optional: true }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
