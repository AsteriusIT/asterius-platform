# Local Keycloak for development: http://localhost:8180 (admin / admin), realm "asterius" with the platform client.
#   docker compose -f deploy/keycloak/docker-compose.yaml up -d
# then run the platform with (see .env.example):
#   AUTH_PROVIDERS=local,keycloak KEYCLOAK_URL=http://localhost:8180 KEYCLOAK_CLIENT_SECRET=dev-secret-change-me
# Data lives in the container (start-dev, H2): `down -v` resets it. Production: the Helm chart (keycloak.enabled).
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: '8180'
      ASTERIUS_CLIENT_SECRET: dev-secret-change-me
      ASTERIUS_PUBLIC_URL: http://localhost:5173
    ports:
      - '8180:8180'
    volumes:
      - ./realm-asterius.json:/opt/keycloak/data/import/realm-asterius.json:ro
