{{- include "ap.validate" . -}}
{{- $v := .Values -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ap.fullname" . }}-env
  labels: {{- include "ap.labels" . | nindent 4 }}
data:
  PUBLIC_URL: {{ $v.publicUrl | quote }}
  CONFIG_DIR: /etc/asterius/config
  LOG_LEVEL: {{ $v.settings.logLevel | quote }}
  DATABASE_POOL_SIZE: {{ $v.database.poolSize | quote }}
  WORKER_CONCURRENCY: {{ $v.worker.concurrency | quote }}
  RUN_POLL_SECONDS: {{ $v.settings.runPollSeconds | quote }}
  RUN_TIMEOUT_HOURS: {{ $v.settings.runTimeoutHours | quote }}
  STEP_TIMEOUT_MINUTES: {{ $v.settings.stepTimeoutMinutes | default 1440 | quote }}
  MIGRATE_ON_START: {{ not $v.migrations.job.enabled | quote }}
  HTTP_TIMEOUT_SECONDS: {{ $v.settings.httpTimeoutSeconds | quote }}
  TRUST_PROXY: {{ $v.settings.trustProxy | quote }}
  RETENTION_DAYS: {{ $v.settings.retentionDays | quote }}
  RATE_LIMIT_STORE: {{ $v.settings.rateLimitStore | default "memory" | quote }}
  AUTH_PROVIDERS: {{ $v.auth.providers | quote }}
  ALLOW_REGISTRATION: {{ $v.auth.allowRegistration | quote }}
  SESSION_DAYS: {{ $v.auth.sessionDays | quote }}
  ADMIN_EMAILS: {{ join "," $v.auth.adminEmails | quote }}
  {{- with $v.auth.entra.tenantId }}
  ENTRA_TENANT_ID: {{ . | quote }}
  {{- end }}
  {{- with $v.auth.entra.clientId }}
  ENTRA_CLIENT_ID: {{ . | quote }}
  {{- end }}
  ENTRA_ADMIN_GROUPS: {{ join "," $v.auth.entra.adminGroups | quote }}
  ENTRA_RESYNC_MINUTES: {{ $v.auth.entra.resyncMinutes | quote }}
  KUBE_JOB_NAMESPACES: {{ join "," $v.rbac.jobNamespaces | quote }}
  KUBE_JOB_SERVICE_ACCOUNTS: {{ join "," $v.rbac.jobServiceAccounts | quote }}
  KUBE_JOB_CONTEXTS: {{ join "," $v.rbac.jobContexts | quote }}
  OUTBOUND_ALLOW: {{ join "," $v.outbound.allow | quote }}
  OUTBOUND_DENY: {{ join "," $v.outbound.deny | quote }}
  {{- with $v.tracing.otlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  OTEL_SERVICE_NAME: asterius-platform
  {{- end }}
  {{- range $k, $val := $v.extraEnv }}
  {{ $k }}: {{ $val | quote }}
  {{- end }}
{{- if and (not $v.config.existingConfigMap) (not $v.config.useImageDefaults) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ap.configMapName" . }}
  labels: {{- include "ap.labels" . | nindent 4 }}
data:
  {{- range $name, $content := $v.config.files }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
{{- if not $v.secrets.existingSecret }}
---
{{- $name := include "ap.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := $v.secrets.values.SECRETS_KEY | default (and $existing (index $existing.data "SECRETS_KEY" | default "" | b64dec)) | default (randBytes 32) }}
{{- /* /metrics is reachable through the ingress (same service): always protect it with a token, generated once and kept. */ -}}
{{- $metricsToken := $v.secrets.values.METRICS_TOKEN | default (and $existing (index $existing.data "METRICS_TOKEN" | default "" | b64dec)) | default (randAlphaNum 40) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "ap.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep # losing SECRETS_KEY makes stored secrets unreadable
type: Opaque
stringData:
  SECRETS_KEY: {{ $key | quote }}
  METRICS_TOKEN: {{ $metricsToken | quote }}
  {{- with $v.database.url }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- range $k, $val := omit $v.secrets.values "SECRETS_KEY" "METRICS_TOKEN" }}
  {{ $k }}: {{ $val | quote }}
  {{- end }}
{{- end }}
