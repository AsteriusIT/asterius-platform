{{- if .Values.metrics.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ap.fullname" . }}-dashboard
  labels: {{- include "ap.labels" . | nindent 4 }}
    {{- with .Values.metrics.dashboard.labels }}{{ toYaml . | nindent 4 }}{{- end }}
  {{- with .Values.metrics.dashboard.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  asterius-platform.json: |-
    {{- .Files.Get "dashboards/asterius.json" | nindent 4 }}
{{- end }}
