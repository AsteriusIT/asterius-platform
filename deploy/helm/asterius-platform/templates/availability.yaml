{{- $v := .Values -}}
{{- if $v.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ap.fullname" . }}-api
  labels: {{- include "ap.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "ap.fullname" . }}-api }
  minReplicas: {{ $v.api.autoscaling.minReplicas }}
  maxReplicas: {{ $v.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ $v.api.autoscaling.targetCPUUtilizationPercentage }} } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
---
{{- end }}
{{- range $role := list "api" "worker" }}
{{- $cfg := index $v $role }}
{{- if or (gt (int (index $cfg "replicas")) 1) (and (eq $role "api") $v.api.autoscaling.enabled) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ap.fullname" $ }}-{{ $role }}
  labels: {{- include "ap.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $cfg.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "ap.selector" (dict "root" $ "component" $role) | nindent 6 }}
---
{{- end }}
{{- end }}
