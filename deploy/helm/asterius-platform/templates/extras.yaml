{{- $v := .Values -}}
{{- if $v.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ap.fullname" . }}
  labels: {{- include "ap.labels" . | nindent 4 }}
    {{- with $v.metrics.serviceMonitor.labels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: {{ if $v.metrics.port }}metrics{{ else }}http{{ end }}
      path: /metrics
      interval: {{ $v.metrics.serviceMonitor.interval }}
      {{- if hasKey $v.secrets.values "METRICS_TOKEN" }}
      bearerTokenSecret: { name: {{ include "ap.secretName" . }}, key: METRICS_TOKEN }
      {{- end }}
---
{{- end }}
{{- if $v.database.cnpg.enabled }}
# PostgreSQL managed by the CloudNativePG operator; its generated `<name>-app` Secret provides DATABASE_URL.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "ap.cnpgName" . }}
  labels: {{- include "ap.labels" . | nindent 4 }}
spec:
  instances: {{ $v.database.cnpg.instances }}
  {{- with $v.database.cnpg.imageName }}
  imageName: {{ . }}
  {{- end }}
  {{- if $v.database.cnpg.recovery.enabled }}
  bootstrap:
    recovery:
      source: {{ $v.database.cnpg.recovery.sourceClusterName | required "database.cnpg.recovery.sourceClusterName is required" }}
      database: platform
      owner: platform
      {{- with $v.database.cnpg.recovery.targetTime }}
      recoveryTarget:
        targetTime: {{ . | quote }}
      {{- end }}
  externalClusters:
    - name: {{ $v.database.cnpg.recovery.sourceClusterName }}
      barmanObjectStore:
        destinationPath: {{ $v.database.cnpg.recovery.destinationPath | required "database.cnpg.recovery.destinationPath is required" | quote }}
        {{- with $v.database.cnpg.recovery.endpointURL }}
        endpointURL: {{ . | quote }}
        {{- end }}
        {{- include "ap.barmanCredentials" $ | nindent 8 }}
  {{- else }}
  bootstrap:
    initdb: { database: platform, owner: platform }
  {{- end }}
  {{- if $v.database.cnpg.backup.enabled }}
  backup:
    retentionPolicy: {{ $v.database.cnpg.backup.retentionPolicy | quote }}
    barmanObjectStore:
      destinationPath: {{ $v.database.cnpg.backup.destinationPath | required "database.cnpg.backup.destinationPath is required" | quote }}
      {{- with $v.database.cnpg.backup.endpointURL }}
      endpointURL: {{ . | quote }}
      {{- end }}
      {{- include "ap.barmanCredentials" $ | nindent 6 }}
      wal:
        compression: {{ $v.database.cnpg.backup.compression }}
      data:
        compression: {{ $v.database.cnpg.backup.compression }}
  {{- end }}
  storage:
    size: {{ $v.database.cnpg.storage }}
    {{- with $v.database.cnpg.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  monitoring:
    enablePodMonitor: {{ $v.metrics.serviceMonitor.enabled }}
{{- end }}
{{- if and $v.database.cnpg.enabled $v.database.cnpg.backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "ap.cnpgName" . }}
  labels: {{- include "ap.labels" . | nindent 4 }}
spec:
  schedule: {{ $v.database.cnpg.backup.schedule | quote }}
  backupOwnerReference: self
  immediate: true
  cluster:
    name: {{ include "ap.cnpgName" . }}
{{- end }}
