# Namespace asterius-platform: OpenBao → External Secrets → Kubernetes Secrets used by the chart, and the
# Keycloak database (CloudNativePG) whose owner credentials also come from OpenBao.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-reader # identity of External Secrets in OpenBao (Kubernetes auth role eso-asterius-platform)
  namespace: asterius-platform
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: asterius-platform
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-asterius-platform
          serviceAccountRef: { name: openbao-reader }
---
# The chart's Secret (secrets.existingSecret): every key of secret/asterius-platform/env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asterius-platform-secrets
  namespace: asterius-platform
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: openbao }
  target: { name: asterius-platform-secrets, creationPolicy: Owner }
  dataFrom:
    - extract: { key: asterius-platform/env }
---
# Keycloak Secret (keycloak.existingSecret): KC_DB_*, KC_BOOTSTRAP_ADMIN_*, ASTERIUS_CLIENT_SECRET.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asterius-platform-keycloak
  namespace: asterius-platform
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: openbao }
  target: { name: asterius-platform-keycloak, creationPolicy: Owner }
  dataFrom:
    - extract: { key: asterius-platform/keycloak }
---
# Owner of the Keycloak database, in the basic-auth shape CloudNativePG expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-credentials
  namespace: asterius-platform
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: openbao }
  target:
    name: keycloak-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .KC_DB_USERNAME }}"
        password: "{{ .KC_DB_PASSWORD }}"
  dataFrom:
    - extract: { key: asterius-platform/keycloak }
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: asterius-platform
spec:
  instances: 1
  storage: { size: 1Gi }
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret: { name: keycloak-db-credentials }
  monitoring:
    enablePodMonitor: true
