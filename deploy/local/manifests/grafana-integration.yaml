# Grafana (namespace observability) delivers alert notifications to the platform's inbound webhook
# (integration grafana-alerts). The chart's NetworkPolicy only lets that namespace reach the metrics port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-to-platform-webhook
  namespace: asterius-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: asterius-platform
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: grafana } }
      ports: [{ port: 8080, protocol: TCP }]
