# Namespace observability: Grafana admin credentials from OpenBao (secret/observability/grafana).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-reader # Kubernetes auth role eso-observability
  namespace: observability
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: observability
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-observability
          serviceAccountRef: { name: openbao-reader }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: openbao }
  target: { name: grafana-admin, creationPolicy: Owner }
  dataFrom:
    - extract: { key: observability/grafana }
