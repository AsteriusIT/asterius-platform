actions:
  # --- works out of the box: writes to the catalog itself -------------------------------------------
  - identifier: register-service
    title: Register a service
    icon: plus
    description: Add an existing service to the catalog.
    trigger:
      type: form
      on: create
      blueprint: service
      inputs:
        properties:
          name: { type: string, title: Name, pattern: '^[a-z][a-z0-9-]{2,40}$', description: 'lowercase, digits and dashes' }
          team: { type: string, title: Owning team, format: team }
          system: { type: string, title: System, format: entity, blueprint: system }
          language: { type: string, title: Language, enum: [go, java, node, python, dotnet] }
          repositoryUrl: { type: string, title: Repository URL, format: url }
        required: [name, team, system, language]
        order: [name, team, system, language, repositoryUrl]
    steps:
      - id: run
        name: Register a service
        type: invoke
        invoker:
          type: catalog
          operation: upsert
          blueprint: service
          identifier: '{{ inputs.name }}'
          team: '{{ inputs.team }}'
          properties: { language: '{{ inputs.language }}', repositoryUrl: '{{ inputs.repositoryUrl }}' }
          relations: { system: '{{ inputs.system }}' }

  - identifier: request-environment
    title: Request an environment
    icon: server
    description: Request a new environment. Production environments are approved by the platform team.
    trigger:
      type: form
      on: create
      blueprint: environment
      inputs:
        properties:
          name: { type: string, title: Name, pattern: '^[a-z][a-z0-9-]{2,30}$' }
          type: { type: string, title: Type, enum: [development, staging, production], default: development }
          region: { type: string, title: Region, enum: [westeurope, northeurope, switzerlandnorth], default: westeurope }
          team: { type: string, title: Owning team, format: team }
          expiresAt: { type: string, title: Expires, format: date }
          justification: { type: string, title: Justification, format: markdown }
        required: [name, type, team, justification]
      approval:
        required: true
        approvers: { teams: [platform], roles: [admin] }
        minApprovals: 1
    steps:
      - id: run
        name: Request an environment
        type: invoke
        invoker:
          type: catalog
          operation: upsert
          blueprint: environment
          identifier: '{{ inputs.name }}'
          team: '{{ inputs.team }}'
          properties: { type: '{{ inputs.type }}', region: '{{ inputs.region }}', expiresAt: '{{ inputs.expiresAt }}' }

  - identifier: decommission-expired-environment
    title: Decommission expired environments
    icon: trash
    description: Deletes an environment once its expiry date has passed (event entity.expired, see ttlProperty of the environment blueprint).
    trigger:
      type: event
      event: entity.expired
      blueprint: environment
      # Production environments are never removed automatically.
      filter: 'event.entity.properties.type != "production"'
      inputs: { name: '{{ event.entity.identifier }}' }
    steps:
      - id: run
        name: Delete the environment
        type: invoke
        invoker:
          type: catalog
          operation: delete
          blueprint: environment
          identifier: '{{ inputs.name }}'

  - identifier: change-lifecycle
    title: Change lifecycle
    icon: refresh
    description: Promote or deprecate a service.
    trigger:
      type: form
      on: day-2
      blueprint: service
      inputs:
        properties:
          lifecycle: { type: string, title: Lifecycle, enum: [experimental, production, deprecated] }
        required: [lifecycle]
      allowed: { ownerTeam: true, roles: [admin] }
    steps:
      - id: run
        name: Change lifecycle
        type: invoke
        invoker:
          type: catalog
          operation: upsert
          merge: true
          blueprint: service
          identifier: '{{ entity.identifier }}'
          properties: { lifecycle: '{{ inputs.lifecycle }}' }

  # --- a workflow: AI review → approval only when needed → provisioning ---------------------------
  - identifier: provision-database
    title: Provision a database
    icon: database
    description: |
      Request a managed database. An AI reviewer checks the request against the catalog
      (owning service, environment, size); low-risk requests are provisioned right away,
      the others wait for the platform team.
    trigger:
      type: form
      on: create
      blueprint: database
      inputs:
        properties:
          name: { type: string, title: Name, pattern: '^[a-z][a-z0-9-]{2,40}$', description: 'lowercase, digits and dashes' }
          engine: { type: string, title: Engine, enum: [postgres, mysql], default: postgres }
          sizeGb: { type: integer, title: Storage (GB), minimum: 1, maximum: 4096, default: 20 }
          service: { type: string, title: Used by, format: entity, blueprint: service }
          environment: { type: string, title: Environment, format: entity, blueprint: environment }
          team: { type: string, title: Owning team, format: team }
          justification: { type: string, title: Why, format: markdown }
        required: [name, engine, sizeGb, service, environment, team]
        order: [name, engine, sizeGb, service, environment, team, justification]
    steps:
      - id: review
        name: AI review
        type: agent
        # Without ANTHROPIC_API_KEY the review fails and the request simply goes to a human.
        continueOnError: true
        tools: [catalog]
        effort: medium
        system: |
          You review self-service infrastructure requests for the platform team.
          Use the catalog tools to check that the service and environment exist and who owns them.
          Production environments, storage above 100 GB, or a team that does not own the service are not low risk.
        prompt: |
          Request: a {{ inputs.engine }} database "{{ inputs.name }}" of {{ inputs.sizeGb }} GB
          for service "{{ inputs.service }}" in environment "{{ inputs.environment }}", owned by team "{{ inputs.team }}".
          Requested by {{ trigger.user.email }}. Justification: {{ inputs.justification }}
        output:
          properties:
            risk: { type: string, title: Risk, enum: [low, medium, high] }
            summary: { type: string, title: Summary, description: Two sentences for the approver }
            recommendedTier: { type: string, title: Recommended tier, enum: [burstable, general-purpose, memory-optimized] }
          required: [risk, summary, recommendedTier]

      - id: approval
        name: Platform approval
        type: approval
        if: '$not(steps.review.status = "SUCCESS" and steps.review.output.risk = "low")'
        approvers: { teams: [platform], roles: [admin] }
        message: |
          **{{ inputs.engine }} · {{ inputs.sizeGb }} GB** for `{{ inputs.service }}` in `{{ inputs.environment }}`

          AI review: **{{ steps.review.output.risk ? steps.review.output.risk : "unavailable" }}** — {{ steps.review.output.summary }}

      - id: register
        name: Register in the catalog
        type: invoke
        invoker:
          type: catalog
          operation: upsert
          blueprint: database
          identifier: '{{ inputs.name }}'
          team: '{{ inputs.team }}'
          properties:
            engine: '{{ inputs.engine }}'
            sizeGb: '{{ inputs.sizeGb }}'
            tier: '{{ steps.review.output.recommendedTier ? steps.review.output.recommendedTier : "general-purpose" }}'
          relations:
            usedBy: '{{ [inputs.service] }}'
            environment: '{{ inputs.environment }}'

  - identifier: increase-storage
    title: Increase storage
    icon: database
    description: Grow the database storage (it cannot shrink). The owning team can run it directly.
    trigger:
      type: form
      on: day-2
      blueprint: database
      inputs:
        properties:
          sizeGb: { type: integer, title: New size (GB), minimum: 1, maximum: 4096 }
          reason: { type: string, title: Reason, format: markdown }
        required: [sizeGb]
      allowed: { ownerTeam: true, roles: [admin] }
    steps:
      - id: run
        name: Increase storage
        type: invoke
        invoker:
          type: catalog
          operation: upsert
          merge: true
          blueprint: database
          identifier: '{{ entity.identifier }}'
          properties: { sizeGb: '{{ inputs.sizeGb }}' }

  - identifier: rotate-database-credentials
    title: Rotate credentials
    icon: key
    description: Generate new credentials and update the service secrets.
    trigger:
      type: form
      on: day-2
      blueprint: database
      allowed: { ownerTeam: true, roles: [admin] }
    steps:
      - id: run
        name: Rotate credentials
        type: invoke
        invoker:
          type: catalog
          operation: upsert
          merge: true
          blueprint: database
          identifier: '{{ entity.identifier }}'
          properties: { lastCredentialRotation: '{{ $now() }}' }

  - identifier: delete-database
    title: Delete database
    icon: trash
    description: Remove the database. A final backup is kept 30 days.
    trigger:
      type: form
      on: delete
      blueprint: database
      inputs:
        properties:
          confirm: { type: string, title: Type the database identifier to confirm }
        required: [confirm]
      allowed: { ownerTeam: true, roles: [admin] }
      approval:
        required: true
        approvers: { roles: [admin] }
    steps:
      - id: run
        name: Delete database
        type: invoke
        invoker:
          type: catalog
          operation: delete
          blueprint: database
          identifier: '{{ entity.identifier }}'

  # --- external systems: set the referenced secrets (Admin → Secrets) to use them --------------------
  - identifier: scaffold-service
    title: Create a new service
    icon: brand-github
    description: |
      Creates a repository from the golden-path template, CI included, and registers the service.
      The GitHub workflow reports back through the run callback.
    trigger:
      type: form
      on: create
      blueprint: service
      inputs:
        properties:
          name: { type: string, title: Service name, pattern: '^[a-z][a-z0-9-]{2,40}$' }
          template: { type: string, title: Template, enum: [go-api, node-api, python-fastapi, react-spa], default: go-api }
          team: { type: string, title: Owning team, format: team }
          system: { type: string, title: System, format: entity, blueprint: system }
        required: [name, template, team, system]
      approval:
        required: true
        approvers: { teams: [platform] }
    steps:
      - id: run
        name: Create a new service
        type: invoke
        invoker:
          type: github-workflow
          owner: my-org
          repo: platform-automation
          workflow: scaffold-service.yml
          ref: main
          token: ${secret:GITHUB_TOKEN}
          inputs:
            name: '{{ inputs.name }}'
            template: '{{ inputs.template }}'
            team: '{{ inputs.team }}'
            system: '{{ inputs.system }}'
            callback_url: '{{ run.callback.url }}'
            callback_token: '{{ run.callback.token }}'

  - identifier: deploy-service
    title: Deploy
    icon: rocket
    description: Deploy a version of the service with its Azure DevOps pipeline.
    trigger:
      type: form
      on: day-2
      blueprint: service
      inputs:
        properties:
          environment: { type: string, title: Environment, format: entity, blueprint: environment }
          version: { type: string, title: Version, description: 'Image tag or git ref' }
        required: [environment, version]
      allowed: { ownerTeam: true, roles: [admin] }
      approval:
        # Production deployments need the owning team's approval (by someone else than the requester).
        required: true
        approvers: { ownerTeam: true }
    steps:
      - id: run
        name: Deploy
        type: invoke
        invoker:
          type: azure-pipeline
          organization: https://dev.azure.com/my-org
          project: Platform
          pipelineId: 42
          branch: main
          token: ${secret:ADO_PAT}
          templateParameters:
            service: '{{ entity.identifier }}'
            environment: '{{ inputs.environment }}'
            version: '{{ inputs.version }}'

  - identifier: restart-workload
    title: Restart
    icon: player-play
    description: Rolling restart of the Kubernetes deployment.
    trigger:
      type: form
      on: day-2
      blueprint: workload
      allowed: { roles: [admin] }
    steps:
      - id: run
        name: Restart
        type: invoke
        invoker:
          type: kubernetes-job
          namespace: platform-jobs
          image: bitnami/kubectl:1.33
          serviceAccountName: workload-restarter
          securityContext: { runAsUser: 1001 }
          args: [rollout, restart, deployment, '{{ entity.title }}', -n, '{{ entity.properties.namespace }}']

  - identifier: decommission-service
    title: Decommission
    icon: trash
    description: Archive the repository, remove deployments and delete the service from the catalog.
    trigger:
      type: form
      on: delete
      blueprint: service
      inputs:
        properties:
          confirm: { type: string, title: Type the service name to confirm }
        required: [confirm]
      allowed: { ownerTeam: true, roles: [admin] }
      approval:
        required: true
        approvers: { roles: [admin] }
    steps:
      - id: run
        name: Decommission
        type: invoke
        invoker:
          type: webhook
          url: https://automation.example.internal/decommission
          mode: async
          headers: { Authorization: 'Bearer ${secret:AUTOMATION_TOKEN}' }
          secret: ${secret:WEBHOOK_SIGNING_KEY}
