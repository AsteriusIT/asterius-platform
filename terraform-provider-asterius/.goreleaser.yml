# Release artifacts in the layout the Terraform and OpenTofu registries expect (zips per OS/arch, SHA256SUMS signed
# with GPG, the registry manifest). Nothing is published from CI yet; see README.md → Releasing.
#   goreleaser check
#   goreleaser release --snapshot --clean     # local build into dist/, no signing, no upload
version: 2
project_name: terraform-provider-asterius

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=local
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{ .Version }}'
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, '386', arm]
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - '--batch'
      - '--local-user'
      - '{{ .Env.GPG_FINGERPRINT }}'
      - '--output'
      - '${signature}'
      - '--detach-sign'
      - '${artifact}'

release:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  # The provider is released from its own tags (terraform-provider-asterius/v0.1.0 in this repository, or a mirror
  # repository named terraform-provider-asterius, which the public registries require).
  draft: true

changelog:
  disable: true
